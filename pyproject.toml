[project]
name = "sentinel-firewall"
version = "0.1.0"
description = "Prompt-injection firewall for AI agents: ingress scanning, egress guard, red/blue hardening (ET AI Hackathon, PS2)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # LLM + agent layer
    "google-genai>=2.19,<3",          # never the deprecated google-generativeai
    "google-adk==2.9.2",              # agent layer only (plugin, InboxPilot, red/blue agents)
    "litellm>=1.84",                  # ADK LiteLlm -> local Ollama (instead of google-adk[extensions]; see DECISIONS)
    # API + UI
    "fastapi>=0.133,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9",
    "streamlit>=1.40",
    "pandas>=2.2",
    "plotly>=5.24",
    # config + schemas
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.6",
    "python-dotenv>=1,<2",
    # parsing
    "pymupdf>=1.25",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "markdown-it-py>=3",
    "pillow>=11",
    "pytesseract>=0.3.13",            # needs the tesseract binary: brew install tesseract
    # detection + learning
    "regex>=2024.11",                 # per-match timeouts (ReDoS guard)
    "rapidfuzz>=3.10",                # grounding (partial_ratio)
    "scikit-learn>=1.5",              # TF-IDF exemplar memory
    "diskcache>=5.6",                 # dev cache + verdict cache
]

[dependency-groups]
# Classifiers (C1 DeBERTa, optional C2 Prompt Guard 2). Installed by default; the core runs without them.
ml = [
    "torch>=2.5",
    "transformers>=4.57,<5",          # pinned <5: known-good with DeBERTa-v3
    "sentencepiece>=0.2",
    "protobuf>=5",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
# Public evaluation sets (Slice 5)
eval = [
    "datasets>=3",
]

[tool.uv]
default-groups = ["ml", "dev", "eval"]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: calls real Gemini / Ollama / HuggingFace (opt-in: pytest -m live)",
    "slow: slower tests (OCR, big documents)",
]
addopts = "-m 'not live'"
filterwarnings = [
    "ignore::DeprecationWarning:pytesseract.*",
]
